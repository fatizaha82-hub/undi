<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Undian Duit Kutu Live (Google Sheets)</title>
    <style>
        :root {
            --bg-cream-light: #faf7f2;
            --bg-cream-card: #fdfbf7;
            --card-border: #e2d9cc;
            --text-dark: #2d3748;
            --text-muted: #718096;
            --turquoise-primary: #0d9488;
            --turquoise-light: #14b8a6;
            --turquoise-dark: #115e59;
            --turquoise-glow: rgba(13, 148, 136, 0.2);
            --cream-gradient: linear-gradient(135deg, #ffffff 0%, #fef3c7 50%, #fde68a 100%);
            --cream-shadow: rgba(217, 119, 6, 0.2);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-cream-light);
            color: var(--text-dark);
            padding: 20px 10px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-cream-card);
            padding: 30px 20px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(180, 160, 140, 0.15);
        }

        .header-title {
            text-align: center;
            color: var(--turquoise-dark);
            font-size: 2.1rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        p.subtitle {
            text-align: center;
            color: var(--turquoise-primary);
            margin-bottom: 25px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--turquoise-primary);
            background: white;
            color: var(--turquoise-primary);
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
        }

        .tab-btn.active { background: var(--turquoise-primary); color: white; }

        .section-box {
            background: #ffffff;
            border: 1px solid var(--card-border);
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        label { display: block; font-weight: 600; margin-bottom: 10px; color: #334155; }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 14px;
            background-color: #faf7f2;
            border: 1px solid var(--card-border);
            color: var(--text-dark);
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }

        select option.completed-player {
            color: #94a3b8 !important;
            background-color: #f1f5f9 !important;
            font-style: italic;
        }

        textarea { height: 150px; resize: vertical; }

        .btn {
            background: var(--turquoise-primary);
            color: #fff;
            border: none;
            padding: 15px 20px;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 1.05rem;
            text-transform: uppercase;
            box-shadow: 0 4px 15px var(--turquoise-glow);
        }

        .btn:hover { background: var(--turquoise-dark); }

        .btn-reset {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
            margin-top: 30px;
        }

        .status-bar {
            margin-bottom: 20px;
            padding: 14px;
            background: #ccfbf1;
            border-left: 4px solid var(--turquoise-primary);
            color: var(--turquoise-dark);
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        .session-code-banner {
            background: #fef3c7;
            border: 2px dashed #f59e0b;
            color: #78350f;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .envelopes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
            margin-top: 20px;
        }

        .envelope-card {
            border-radius: 16px;
            padding: 22px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 160px;
        }

        .envelope-card.unopened {
            background: linear-gradient(145deg, #0d9488, #115e59);
            border: 2px solid var(--turquoise-light);
            color: #ffffff;
        }

        .envelope-card.unopened:hover { transform: translateY(-5px); }

        .envelope-card.opened {
            background: var(--cream-gradient);
            border: 2px solid #f59e0b;
            color: #1e293b;
            cursor: not-allowed;
        }

        .opened .env-month-large {
            font-size: 1.45rem;
            font-weight: 900;
            color: #78350f;
            margin-bottom: 4px;
        }

        .opened .env-name-large {
            font-size: 1.25rem;
            font-weight: 800;
            color: #0f172a;
            background: #ffffff;
            padding: 6px 12px;
            border-radius: 8px;
            width: 100%;
        }

        .hidden { display: none !important; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--card-border); }
        th { background: #f1f5f9; color: var(--turquoise-dark); }

        .badge-done {
            background: #fef3c7;
            color: #92400e;
            padding: 5px 12px;
            border-radius: 6px;
            font-weight: 800;
            display: inline-block;
            margin: 2px 4px 2px 0;
            border: 1px solid #fde68a;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">💎 Cabutan Undi Duit Kutu</div>
    <p class="subtitle">Sistem Undian 6 Bulan (2 Orang Setiap Bulan)</p>

    <div id="authView">
        <div class="tab-group">
            <button id="tabCreate" class="tab-btn active" onclick="switchTab('create')">Penganjur (Cipta Sesi)</button>
            <button id="tabJoin" class="tab-btn" onclick="switchTab('join')">Peserta (Masuk Sesi)</button>
        </div>

        <div id="createSection" class="section-box">
            <label for="namesInput">📝 Masukkan Senarai 12 Nama Peserta (1 Nama Setiap Baris):</label>
            <textarea id="namesInput">...</textarea>
            <button type="button" class="btn" onclick="createSession()">✨ Cipta Sesi Undian</button>
        </div>

        <div id="joinSection" class="section-box hidden">
            <label for="codeInput">🔑 Masukkan Kod Sesi (6-Angka daripada Penganjur):</label>
            <input type="text" id="codeInput" placeholder="Contoh: 839201" maxlength="6" style="text-align:center; font-size:1.3rem; letter-spacing:3px;">
            <button type="button" class="btn" onclick="joinSession()">🚀 Masuk Sesi Undian</button>
        </div>
    </div>

    <div id="drawView" class="hidden">
        <div class="session-code-banner" id="sessionCodeDisplay">KOD SESI: -</div>

        <div class="section-box" style="margin-bottom: 15px;">
            <label for="activePlayer">👤 Pilih Nama Peserta Yang Sedang Cabut:</label>
            <select id="activePlayer" onchange="checkPlayerSelection()"></select>
        </div>

        <div class="status-bar" id="statusText">Memuatkan data dari Google Sheets...</div>

        <div class="envelopes-grid" id="envelopesContainer"></div>

        <h3 style="margin-top: 35px; color: var(--turquoise-dark); font-size: 1.2rem;">📊 Keputusan Rasmi Penerima Kutu (6 Bulan)</h3>
        <table>
            <thead>
                <tr>
                    <th>Bulan</th>
                    <th>Nama Penerima</th>
                </tr>
            </thead>
            <tbody id="resultTable"></tbody>
        </table>

        <button type="button" class="btn btn-reset" onclick="resetAll()">🔄 Keluar / Mula Sesi Baru</button>
    </div>
</div>

<script>
    // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyNYfLVyfkWBLb4vaw4OpJKAySqPxK9zMIvdC2G4EK2ZHZju8ZY1A2Xl_yUQalv6Qz9/exec";

    let currentCode = null;
    let sessionData = null;
    let syncTimer = null;

    function switchTab(type) {
        if(type === 'create') {
            document.getElementById('tabCreate').classList.add('active');
            document.getElementById('tabJoin').classList.remove('active');
            document.getElementById('createSection').classList.remove('hidden');
            document.getElementById('joinSection').classList.add('hidden');
        } else {
            document.getElementById('tabJoin').classList.add('active');
            document.getElementById('tabCreate').classList.remove('active');
            document.getElementById('joinSection').classList.remove('hidden');
            document.getElementById('createSection').classList.add('hidden');
        }
    }

    async function createSession() {
        const input = document.getElementById('namesInput').value.trim();
        if (!input) return alert('Sila masukkan senarai nama peserta!');

        const players = input.split('\n').map(n => n.trim()).filter(n => n !== '');
        if (players.length === 0) return alert('Sila masukkan sekurang-kurangnya 1 nama.');

        const sessionCode = Math.floor(100000 + Math.random() * 900000).toString();

        let drawSlots = [];
        const totalMonths = Math.ceil(players.length / 2);
        for (let i = 1; i <= totalMonths; i++) {
            drawSlots.push({ month: `Bulan ${i}` });
            drawSlots.push({ month: `Bulan ${i}` });
        }
        drawSlots = drawSlots.slice(0, players.length);

        let secretEnvelopes = [...drawSlots];
        for (let i = secretEnvelopes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [secretEnvelopes[i], secretEnvelopes[j]] = [secretEnvelopes[j], secretEnvelopes[i]];
        }

        sessionData = {
            players: players,
            secretEnvelopes: secretEnvelopes,
            totalMonths: totalMonths,
            results: {}
        };

        alert('Mencipta sesi baru di Google Sheets...');

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code: sessionCode, data: sessionData })
            });

            listenToSession(sessionCode);
        } catch (err) {
            alert('Ralat menyimpan ke Google Sheets: ' + err.message);
        }
    }

    function joinSession() {
        const code = document.getElementById('codeInput').value.trim();
        if (code.length !== 6) return alert('Sila masukkan Kod Sesi 6-Angka yang sah!');
        listenToSession(code);
    }

    function listenToSession(code) {
        currentCode = code;
        document.getElementById('authView').classList.add('hidden');
        document.getElementById('drawView').classList.remove('hidden');
        document.getElementById('sessionCodeDisplay').innerText = `🔑 KOD SESI: ${code}`;

        fetchDataFromSheets();
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = setInterval(fetchDataFromSheets, 3000); // Sync automatik setiap 3 saat
    }

    async function fetchDataFromSheets() {
        try {
            const res = await fetch(`${SCRIPT_URL}?action=get&code=${currentCode}`);
            const data = await res.json();

            if (data.status === "error") {
                document.getElementById('statusText').innerText = "Ralat: Kod Sesi tidak dijumpai dalam Google Sheets.";
                return;
            }

            sessionData = data;
            if(!sessionData.results) sessionData.results = {};

            renderPlayerDropdown();
            renderEnvelopes();
            renderTable();
        } catch (err) {
            console.error("Gagal muat data Google Sheets:", err);
        }
    }

    function renderPlayerDropdown() {
        const select = document.getElementById('activePlayer');
        const selectedVal = select.value;
        select.innerHTML = '';
        
        const results = sessionData.results || {};
        const takenPlayers = Object.values(results).map(r => r.player);

        const defaultOpt = document.createElement('option');
        defaultOpt.value = "";
        defaultOpt.textContent = "-- Pilih Nama Peserta --";
        select.appendChild(defaultOpt);

        let activeCount = 0;
        sessionData.players.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p;
            if (takenPlayers.includes(p)) {
                opt.textContent = `${p} (Selesai Cabut)`;
                opt.disabled = true;
                opt.className = 'completed-player';
            } else {
                opt.textContent = p;
                activeCount++;
            }
            select.appendChild(opt);
        });

        if (selectedVal && !takenPlayers.includes(selectedVal)) {
            select.value = selectedVal;
        }

        if (activeCount === 0) {
            document.getElementById('statusText').innerText = '🎉 Semua peserta telah selesai membuat cabutan!';
            document.getElementById('statusText').style.background = '#d1fae5';
            document.getElementById('statusText').style.color = '#047857';
        } else {
            document.getElementById('statusText').innerText = 'Sila pilih nama peserta dari menu di atas, kemudian klik mana-mana Sampul Turquoise!';
            document.getElementById('statusText').style.background = '#ccfbf1';
            document.getElementById('statusText').style.color = 'var(--turquoise-dark)';
        }
    }

    function checkPlayerSelection() {
        const selectedPlayer = document.getElementById('activePlayer').value;
        if (selectedPlayer) {
            document.getElementById('statusText').innerText = `Sila minta [ ${selectedPlayer} ] memilih mana-mana Sampul Kad di bawah!`;
        }
    }

    function renderEnvelopes() {
        const container = document.getElementById('envelopesContainer');
        container.innerHTML = '';
        const results = sessionData.results || {};

        sessionData.secretEnvelopes.forEach((assignedSlot, index) => {
            const envNum = index + 1;
            const card = document.createElement('div');
            const isOpened = results[envNum] !== undefined;

            if (!isOpened) {
                card.className = 'envelope-card unopened';
                card.onclick = () => pickEnvelope(envNum, assignedSlot);
                card.innerHTML = `<div class="env-icon">✉️</div><div style="font-size:0.85rem; color:#e0f2fe; font-weight:700;">KLIK CABUT</div>`;
            } else {
                card.className = 'envelope-card opened';
                card.innerHTML = `<div class="env-month-large">${results[envNum].month}</div><div class="env-name-large">${results[envNum].player}</div>`;
            }
            container.appendChild(card);
        });
    }

    async function pickEnvelope(envNum, assignedSlot) {
        const playerSelect = document.getElementById('activePlayer');
        const selectedPlayer = playerSelect.value;
        if (!selectedPlayer) return alert('Sila pilih Nama Peserta terlebih dahulu!');

        sessionData.results[envNum] = {
            player: selectedPlayer,
            month: assignedSlot.month
        };

        document.getElementById('statusText').innerText = 'Menyimpan cabutan ke Google Sheets...';

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code: currentCode, data: sessionData })
            });

            fetchDataFromSheets();
        } catch (err) {
            alert('Gagal menyimpan cabutan!');
        }
    }

    function renderTable() {
        const tbody = document.getElementById('resultTable');
        tbody.innerHTML = '';
        const results = sessionData.results || {};

        for (let i = 1; i <= sessionData.totalMonths; i++) {
            const monthName = `Bulan ${i}`;
            let recipients = [];
            for (let env in results) {
                if (results[env].month === monthName) recipients.push(results[env].player);
            }
            let recipientHTML = recipients.length > 0 ? recipients.map(p => `<span class="badge-done">👑 ${p}</span>`).join(' ') : '<span style="color:var(--text-muted)">Belum dicabut</span>';
            
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><strong>${monthName}</strong></td><td>${recipientHTML}</td>`;
            tbody.appendChild(tr);
        }
    }

    function resetAll() {
        if (confirm('Adakah anda pasti ingin keluar dari sesi ini?')) {
            location.reload();
        }
    }
</script>

</body>
</html>
